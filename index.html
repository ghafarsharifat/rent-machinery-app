<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اجاره ماشین‌آلات</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4;color:#222}
header{background:#222;color:#fff;padding:25px;text-align:center}
h1{margin:0}
.container{padding:20px;max-width:700px;margin:auto}
.card{background:white;padding:20px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #ccc}
button{background:#ff9800;border:0;padding:12px 20px;border-radius:8px;font-size:16px}
</style>
</head>
<body>

<header>
<h1>اجاره ماشین‌آلات</h1>
<p>ثبت و جستجوی ماشین‌آلات راه‌سازی و معدنی</p>
</header>

<div class="container">

<div class="card">
<h2>🚜 ثبت آگهی</h2>
<p>ماشین‌آلات خود را برای اجاره ثبت کنید.</p>
<button>ثبت آگهی</button>
</div>

<div class="card">
<h2>🔎 جستجوی ماشین‌آلات</h2>
<p>بیل مکانیکی، لودر، کامیون، پیکور و سایر ماشین‌آلات.</p>
<button>مشاهده آگهی‌ها</button>
</div>

<div class="card">
<h2>📍 نشانی‌ها</h2>
<p>مشاهده محل فعالیت و موقعیت ماشین‌آلات.</p>
</div>

</div>

</body>
</html>
